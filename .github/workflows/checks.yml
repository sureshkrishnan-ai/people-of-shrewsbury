# Checks on every pull request and push to main / shrewsbury: tests, type-checks, a build. No secrets.
# Make "checks" a required status check (Settings → Branches → dev and main) so a red PR can't be merged:
# then broken code never reaches Vercel or Cloudflare. Uses no secrets, so it's safe for any PR.

name: checks

on:
  pull_request:
    branches: [main, shrewsbury]
  push:
    branches: [main, shrewsbury]

concurrency:
  group: checks-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            realtime/package-lock.json

      - name: Install
        run: |
          npm ci --ignore-scripts
          npm ci --prefix realtime

      - name: Tests (message format, movement checks)
        run: npm test

      - name: Type-check the game and website
        run: npx tsc --noEmit -p .

      - name: Type-check the room server
        run: npm --prefix realtime run typecheck

      - name: Build the site (no secrets: guest mode)
        run: npm run build

      - name: District data is present
        run: test $(ls public/districts/*.json | wc -l) -ge 6
